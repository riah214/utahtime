</div>

<script>

    /*
        States that have more than one time zone.

        The first value is the default time zone.
        The second value is the additional time zone.
    */

    const multipleTimeZones = {

        "AK": [
            ["Alaska Time", -8],
            ["Aleutian Time", -9]
        ],

        "AZ": [
            ["Most of Arizona — MST", 1],
            ["Navajo Nation — MDT", 0]
        ],

        "FL": [
            ["Eastern Time", -2],
            ["Central Time", -1]
        ],

        "ID": [
            ["Mountain Time", 0],
            ["Pacific Time", 1]
        ],

        "IN": [
            ["Eastern Time", -2],
            ["Central Time", -1]
        ],

        "KS": [
            ["Central Time", -1],
            ["Mountain Time", 0]
        ],

        "KY": [
            ["Eastern Time", -2],
            ["Central Time", -1]
        ],

        "MI": [
            ["Eastern Time", -2],
            ["Central Time", -1]
        ],

        "NE": [
            ["Central Time", -1],
            ["Mountain Time", 0]
        ],

        "ND": [
            ["Central Time", -1],
            ["Mountain Time", 0]
        ],

        "OR": [
            ["Pacific Time", 1],
            ["Mountain Time", 0]
        ],

        "SD": [
            ["Central Time", -1],
            ["Mountain Time", 0]
        ],

        "TN": [
            ["Central Time", -1],
            ["Eastern Time", -2]
        ],

        "TX": [
            ["Central Time", -1],
            ["Mountain Time", 0]
        ]
    };


    /*
        States with only one time zone.

        Number represents how many hours must be
        added to the state's time to get Utah time.

        Example:

        California = +1

        California 5 PM
        \+ 1 hour
        = Utah 6 PM
    */

    const singleTimeZones = {

        "AL": -1,
        "AR": -1,
        "CA": 1,
        "CO": 0,
        "CT": -2,
        "DE": -2,
        "GA": -2,
        "HI": 4,
        "IL": -1,
        "IA": -1,
        "LA": -1,
        "ME": -2,
        "MD": -2,
        "MA": -2,
        "MN": -1,
        "MS": -1,
        "MO": -1,
        "MT": 0,
        "NV": 1,
        "NH": -2,
        "NJ": -2,
        "NM": 0,
        "NY": -2,
        "NC": -2,
        "OH": -2,
        "OK": -1,
        "PA": -2,
        "RI": -2,
        "SC": -2,
        "UT": 0,
        "VT": -2,
        "VA": -2,
        "WA": 1,
        "WV": -2,
        "WI": -1,
        "WY": 0
    };


    /*
        Show the time-zone selector only when
        the state has multiple time zones.
    */

    function updateTimeZones() {

        const state =
            document.getElementById("state").value;

        const container =
            document.getElementById("timezoneContainer");

        const timezone =
            document.getElementById("timezone");


        timezone.innerHTML = "";


        if (multipleTimeZones[state]) {

            container.style.display = "block";


            multipleTimeZones[state].forEach(zone => {

                const option =
                    document.createElement("option");

                option.value = zone[1];

                option.textContent = zone[0];

                timezone.appendChild(option);

            });

        } else {

            container.style.display = "none";
        }
    }


    /*
        Convert the entered time to Utah time.
    */

    function convertTime() {

        const state =
            document.getElementById("state").value;

        const time =
            document.getElementById("time").value;


        if (!state || !time) {

            alert(
                "Please choose a state and enter a time."
            );

            return;
        }


        let offset;


        /*
            If the state has multiple time zones,
            use the selected time zone.
        */

        if (multipleTimeZones[state]) {

            offset =
                parseInt(
                    document.getElementById("timezone").value
                );

        } else {

            offset =
                singleTimeZones[state];
        }


        /*
            Break the entered time into hours
            and minutes.
        */

        let [hours, minutes] =
            time.split(":").map(Number);


        let totalMinutes =
            hours * 60 +
            minutes;


        /*
            Apply the time-zone difference.
        */

        totalMinutes +=
            offset * 60;


        /*
            Handle going past midnight.
        */

        totalMinutes =
            (totalMinutes + 1440) % 1440;


        /*
            Convert back to hours and minutes.
        */

        let newHours =
            Math.floor(totalMinutes / 60);

        let newMinutes =
            totalMinutes % 60;


        /*
            Convert to 12-hour format.
        */

        const period =
            newHours >= 12 ? "PM" : "AM";


        let displayHours =
            newHours % 12;


        if (displayHours === 0) {
            displayHours = 12;
        }


        const formattedMinutes =
            newMinutes
                .toString()
                .padStart(2, "0");


        const formattedTime =
            `${displayHours}:${formattedMinutes} ${period}`;


        /*
            Display result.
        */

        document.getElementById("utahTime")
            .textContent =
            formattedTime;


        /*
            Display explanation.
        */

        let explanation;


        if (offset === 0) {

            explanation =
                "The time is the same as Utah.";

        } else if (offset > 0) {

            explanation =
                `Utah is ${offset} hour${
                    offset === 1 ? "" : "s"
                } ahead.`;

        } else {

            const difference =
                Math.abs(offset);

            explanation =
                `Utah is ${difference} hour${
                    difference === 1 ? "" : "s"
                } behind.`;
        }


        document.getElementById("difference")
            .textContent =
            explanation;


        document.getElementById("result")
            .style.display =
            "block";
    }

</script>
