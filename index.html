<script>

    function convertTime() {

        const stateSelect = document.getElementById("state");
        const timeInput = document.getElementById("time");

        const result = document.getElementById("result");
        const utahTime = document.getElementById("utahTime");
        const difference = document.getElementById("difference");

        if (stateSelect.value === "" || timeInput.value === "") {

            alert("Please choose a state and enter a time.");

            return;
        }


        // Difference between the selected state and Utah.
        // Positive = state is behind Utah.
        // Negative = state is ahead of Utah.

        const offset = parseInt(stateSelect.value);


        const [hours, minutes] = timeInput.value.split(":");

        let totalMinutes =
            parseInt(hours) * 60 +
            parseInt(minutes);


        // Convert the state's time to Utah time.

        totalMinutes += offset * 60;


        // Handle going past midnight.

        totalMinutes =
            (totalMinutes + 1440) % 1440;


        const newHours =
            Math.floor(totalMinutes / 60);

        const newMinutes =
            totalMinutes % 60;


        // Convert to 12-hour time.

        let period = newHours >= 12 ? "PM" : "AM";

        let displayHours =
            newHours % 12;

        if (displayHours === 0) {
            displayHours = 12;
        }


        const formattedMinutes =
            newMinutes.toString().padStart(2, "0");


        const formattedTime =
            `${displayHours}:${formattedMinutes} ${period}`;


        utahTime.textContent = formattedTime;


        // Show the time difference.

        if (offset === 0) {

            difference.textContent =
                "This state is in the same time zone as Utah.";

        } else if (offset > 0) {

            difference.textContent =
                `Utah is ${offset} hour${offset > 1 ? "s" : ""} ahead of this state.`;

        } else {

            const hoursAhead = Math.abs(offset);

            difference.textContent =
                `Utah is ${hoursAhead} hour${hoursAhead > 1 ? "s" : ""} behind this state.`;
        }


        result.style.display = "block";
    }

</script>
