<!DOCTYPE html>

<head>

<title>Utah Time Converter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f8;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin: 8px 0 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 6px;
}

select,
input {
    width: 100%;
    padding: 13px;
    font-size: 17px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
}

select:focus,
input:focus {
    outline: none;
    border-color: #555;
}

/* QUICK TIME ZONES */

.quick-title {
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

.quick-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.quick-buttons button {
    padding: 9px 5px;
    background: #f1f1f1;
    color: #222;
    border: 1px solid #ddd;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
}

.quick-buttons button:hover {
    background: #ddd;
}

/* TIME ZONE */

#timezoneContainer {
    display: none;
}

/* TIME ROW */

.time-row {
    display: flex;
    gap: 8px;
}

.time-row input {
    flex: 1;
}

.now-button {
    width: 75px;
    border: none;
    border-radius: 9px;
    background: #333;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.now-button:hover {
    background: #555;
}

/* SWITCH */

.switch-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

.switch-button {
    border: none;
    background: transparent;
    color: #444;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.switch-button:hover {
    text-decoration: underline;
}

/* RESULT */

.result {
    margin-top: 20px;
    padding: 25px;
    border-radius: 14px;
    background: #eef4ff;
    text-align: center;
}

.result-label {
    font-size: 15px;
    color: #666;
}

.result-time {
    font-size: 40px;
    font-weight: bold;
    margin: 8px 0;
}

.result-difference {
    color: #555;
    font-size: 15px;
}

.error {
    color: #b00020;
    text-align: center;
    margin-top: 15px;
    display: none;
}

.footer {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-top: 20px;
}

/* MOBILE */

@media (max-width: 450px) {

    .container {
        padding: 22px;
    }

    .quick-buttons {
        grid-template-columns: repeat(2, 1fr);
    }

    .result-time {
        font-size: 34px;
    }
}

</style>

</head>

<body>

<script>

/*
====================================================
TIME ZONE INFORMATION
====================================================
*/

const zones = {

    Pacific: {
        name: "Pacific Time",
        offset: -1
    },

    Mountain: {
        name: "Mountain Time",
        offset: 0
    },

    Central: {
        name: "Central Time",
        offset: 1
    },

    Eastern: {
        name: "Eastern Time",
        offset: 2
    }

};


/*
====================================================
STATE DEFAULT TIME ZONES
====================================================
*/

const stateZones = {

    AL: ["Central"],
    AK: ["Alaska"],
    AZ: ["Arizona"],
    AR: ["Central"],
    CA: ["Pacific"],
    CO: ["Mountain"],
    CT: ["Eastern"],
    DE: ["Eastern"],
    FL: ["Eastern", "Central"],
    GA: ["Eastern"],
    HI: ["Hawaii"],
    ID: ["Mountain", "Pacific"],
    IL: ["Central"],
    IN: ["Eastern", "Central"],
    IA: ["Central"],
    KS: ["Central", "Mountain"],
    KY: ["Eastern", "Central"],
    LA: ["Central"],
    ME: ["Eastern"],
    MD: ["Eastern"],
    MA: ["Eastern"],
    MI: ["Eastern", "Central"],
    MN: ["Central"],
    MS: ["Central"],
    MO: ["Central"],
    MT: ["Mountain"],
    NE: ["Central", "Mountain"],
    NV: ["Pacific"],
    NH: ["Eastern"],
    NJ: ["Eastern"],
    NM: ["Mountain"],
    NY: ["Eastern"],
    NC: ["Eastern"],
    ND: ["Central", "Mountain"],
    OH: ["Eastern"],
    OK: ["Central"],
    OR: ["Pacific", "Mountain"],
    PA: ["Eastern"],
    RI: ["Eastern"],
    SC: ["Eastern"],
    SD: ["Central", "Mountain"],
    TN: ["Central", "Eastern"],
    TX: ["Central", "Mountain"],
    UT: ["Mountain"],
    VT: ["Eastern"],
    VA: ["Eastern"],
    WA: ["Pacific"],
    WV: ["Eastern"],
    WI: ["Central"],
    WY: ["Mountain"]

};


/*
====================================================
SPECIAL TIME ZONE DIFFERENCES
====================================================
*/

const specialOffsets = {

    Alaska: -2,
    Arizona: 1,
    Hawaii: 4

};


/*
====================================================
DIRECTION
====================================================
*/

let direction = "customerToUtah";


/*
====================================================
STATE CHANGED
====================================================
*/

function stateChanged() {

    const state =
        document.getElementById("state").value;

    const container =
        document.getElementById("timezoneContainer");

    const timezone =
        document.getElementById("timezone");


    timezone.innerHTML = "";


    if (!state) {

        container.style.display = "none";

        convert();

        return;
    }


    const availableZones =
        stateZones[state];


    /*
    If state has more than one time zone,
    show the time zone dropdown.
    */

    if (availableZones.length > 1) {

        container.style.display = "block";


        availableZones.forEach(zone => {

            const option =
                document.createElement("option");

            option.value = zone;

            option.textContent =
                zone + " Time";

            timezone.appendChild(option);

        });

    }

    else {

        container.style.display = "none";

    }


    convert();
}


/*
====================================================
QUICK TIME ZONE BUTTONS
====================================================
*/

function quickZone(zone) {

    /*
    Clear state because the user is choosing
    a time zone instead of a specific state.
    */

    document.getElementById("state").value = "";

    document.getElementById("timezoneContainer")
        .style.display = "block";


    const timezone =
        document.getElementById("timezone");

    timezone.innerHTML = "";


    const option =
        document.createElement("option");

    option.value = zone;

    option.textContent =
        zone + " Time";

    timezone.appendChild(option);


    convert();
}


/*
====================================================
GET SELECTED ZONE
====================================================
*/

function getSelectedZone() {

    const state =
        document.getElementById("state").value;


    /*
    If a state is selected...
    */

    if (state) {

        const available =
            stateZones[state];


        /*
        If it only has one zone,
        use that zone.
        */

        if (available.length === 1) {

            return available[0];

        }


        /*
        Otherwise use the dropdown.
        */

        return document.getElementById("timezone").value;
    }


    /*
    If no state is selected,
    use quick-select zone.
    */

    return document.getElementById("timezone").value;
}


/*
====================================================
GET OFFSET
====================================================
*/

function getOffset(zone) {

    if (zone === "Alaska") {
        return -2;
    }

    if (zone === "Hawaii") {
        return 4;
    }

    if (zone === "Arizona") {
        return 1;
    }

    return zones[zone]
        ? zones[zone].offset
        : 0;
}


/*
====================================================
CONVERT TIME
====================================================
*/

function convert() {

    const time =
        document.getElementById("time").value;


    const zone =
        getSelectedZone();


    if (!time || !zone) {

        document.getElementById("resultTime")
            .textContent = "—";

        document.getElementById("difference")
            .textContent =
            "Select a state and enter a time.";

        return;
    }


    let [hours, minutes] =
        time.split(":").map(Number);


    let totalMinutes =
        hours * 60 + minutes;


    const offset =
        getOffset(zone);


    /*
    CUSTOMER → UTAH

    Example:

    Eastern 2:00 PM
    Utah is 2 hours behind
    Result = 12:00 PM

    */

    if (direction === "customerToUtah") {

        totalMinutes -=
            offset * 60;

    }


    /*
    UTAH → CUSTOMER

    Example:

    Utah 12:00 PM
    Eastern is 2 hours ahead
    Result = 2:00 PM

    */

    else {

        totalMinutes +=
            offset * 60;

    }


    /*
    Handle midnight.
    */

    totalMinutes =
        (totalMinutes + 1440) % 1440;


    const newHours =
        Math.floor(totalMinutes / 60);

    const newMinutes =
        totalMinutes % 60;


    const period =
        newHours >= 12 ? "PM" : "AM";


    let displayHours =
        newHours % 12;


    if (displayHours === 0) {
        displayHours = 12;
    }


    const formattedMinutes =
        String(newMinutes)
            .padStart(2, "0");


    const formattedTime =
        `${displayHours}:${formattedMinutes} ${period}`;


    document.getElementById("resultTime")
        .textContent =
        formattedTime;


    /*
    Difference message.
    */

    let difference;


    if (offset === 0) {

        difference =
            "Same time as Utah.";

    }

    else if (offset > 0) {

        difference =
            `Utah is ${offset} hour${
                offset === 1 ? "" : "s"
            } behind ${zone} Time.`;

    }

    else {

        difference =
            `Utah is ${Math.abs(offset)} hour${
                Math.abs(offset) === 1 ? "" : "s"
            } ahead of ${zone} Time.`;

    }


    document.getElementById("difference")
        .textContent =
        difference;
}


/*
====================================================
SWITCH DIRECTION
====================================================
*/

function switchDirection() {

    if (direction === "customerToUtah") {

        direction = "utahToCustomer";


        document.getElementById("timeLabel")
            .textContent =
            "Utah Time";


        document.getElementById("resultLabel")
            .textContent =
            "Customer's Time";


        document.getElementById("switchButton")
            .textContent =
            "⇄ Switch to Customer → Utah";

    }

    else {

        direction = "customerToUtah";


        document.getElementById("timeLabel")
            .textContent =
            "Customer's Time";


        document.getElementById("resultLabel")
            .textContent =
            "Utah Time";


        document.getElementById("switchButton")
            .textContent =
            "⇄ Switch to Utah → Customer";
    }


    convert();
}


/*
====================================================
CURRENT TIME
====================================================
*/

function useCurrentTime() {

    const now =
        new Date();


    const hours =
        String(now.getHours())
            .padStart(2, "0");


    const minutes =
        String(now.getMinutes())
            .padStart(2, "0");


    document.getElementById("time")
        .value =
        `${hours}:${minutes}`;


    convert();
}

</script>
